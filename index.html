<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIRST SENTENCE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

  #root {
    position: fixed; inset: 0;
    transition: background-color 60s linear, color 60s linear;
    --conn: #c8c8c8;
  }
  #root.day  { background-color: #ffffff; color: #000000; --conn: #c8c8c8; --c-seed: #111111; --c-syn: #15803d; --c-hyper: #1d4ed8; --c-hypo: #d62828; --c-assoc: #b45309; --c-deriv: #7c3aed; }
  #root.night{ background-color: #000000; color: #ffffff; --conn: #3a3a3a; --c-seed: #ffffff; --c-syn: #4fd18b; --c-hyper: #6aa5ff; --c-hypo: #ff6b6b; --c-assoc: #fbbf24; --c-deriv: #c4b5fd; }

  /* Genesis */
  #genesis {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 64px;
    transition: opacity 1.2s ease;
  }
  .genesis-title { font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; font-weight: 400; }
  .genesis-field { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .genesis-input {
    width: min(560px, 80vw);
    background: transparent; border: none; border-bottom: 1px solid;
    outline: none; padding: 8px 4px; font-size: 18px; letter-spacing: 0.02em;
    color: inherit; text-align: center; border-radius: 0;
  }
  #root.day .genesis-input   { border-bottom-color: rgba(0,0,0,0.18); }
  #root.night .genesis-input { border-bottom-color: rgba(255,255,255,0.22); }
  .genesis-input::placeholder { color: transparent; }
  .genesis-hint { font-size: 10px; letter-spacing: 0.22em; opacity: 0.3; text-transform: uppercase; }

  /* Thought world */
  #viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: visible; transform-origin: 0 0; }
  #world.smooth { transition: transform 1.4s cubic-bezier(0.22,1,0.36,1); }
  #lines { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  .thought-line { stroke: var(--conn); stroke-width: 1; opacity: 0.4; transition: opacity 1.5s ease; fill: none; }
  .thought-line.r-syn   { stroke: var(--c-syn);   opacity: 0.5; }
  .thought-line.r-hyper { stroke: var(--c-hyper); opacity: 0.5; }
  .thought-line.r-hypo  { stroke: var(--c-hypo);  opacity: 0.5; stroke-dasharray: 2 6; }
  .thought-line.r-assoc { stroke: var(--c-assoc); opacity: 0.45; }
  .thought-line.r-deriv { stroke: var(--c-deriv); opacity: 0.5; }

  .thought-node {
    position: absolute; transform: translate(-50%, -50%);
    width: max-content; max-width: 280px; min-width: 4em; padding: 3px 5px;
    text-align: center; font-size: 15px; line-height: 1.65; letter-spacing: 0.02em;
    white-space: nowrap; overflow-wrap: break-word;
    opacity: 0; animation: node-in 1.1s ease forwards;
  }
  .thought-node.seed { white-space: nowrap; max-width: none; min-width: 0; font-weight: 700; border-bottom: 1px solid currentColor; padding-bottom: 3px; }
  .thought-node[data-relation="synonym"]     { color: var(--c-syn); }
  .thought-node[data-relation="hypernym"]    { color: var(--c-hyper); font-weight: 700; }
  .thought-node[data-relation="hyponym"]     { color: var(--c-hypo);  font-style: italic; }
  .thought-node[data-relation="association"] { color: var(--c-assoc); }
  .thought-node[data-relation="derivation"]  { color: var(--c-deriv); text-decoration: underline; text-underline-offset: 3px; }
  .node-tag {
    position: absolute; left: 50%; top: -1.7em; transform: translateX(-50%);
    white-space: nowrap; font-size: 8.5px; letter-spacing: 0.22em; opacity: 0.7; pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @keyframes node-in {
    from { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    to   { opacity: 0.92; transform: translate(-50%,-50%) scale(1); }
  }

  #status {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.14em; opacity: 0.55; text-align: center; max-width: 80vw;
    pointer-events: none; user-select: none; z-index: 40;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #hud {
    position: fixed; right: 22px; bottom: 20px;
    font-size: 10px; line-height: 1.9; letter-spacing: 0.1em; opacity: 0.7;
    text-align: right; pointer-events: none; user-select: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #hud:hover { opacity: 1; }
  #esc-hint {
    position: fixed; left: 22px; bottom: 20px;
    font-size: 10px; letter-spacing: 0.22em; opacity: 0.22; text-transform: uppercase;
    pointer-events: auto; cursor: pointer; padding: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @media (hover: none) { #esc-hint { opacity: 0.5; } }

  /* Final log */
  #final {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 16vh 24px 14vh; text-align: center;
  }
  #final .meta {
    font-size: 11px; line-height: 2; letter-spacing: 0.14em; opacity: 0.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #final .gap { flex: 1; min-height: 34vh; }
  #final .last { font-size: 16px; line-height: 1.7; max-width: 560px; opacity: 0.9; }
  #final .closing {
    font-size: 14px; opacity: 0.7; letter-spacing: 0.04em; line-height: 1.8;
    font-weight: 700; font-style: italic;
    text-decoration: underline; text-underline-offset: 4px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  #final .top-link {
    margin-top: 2.4em;
    font-size: 11px; letter-spacing: 0.22em; opacity: 0.45;
    text-transform: uppercase; text-decoration: none; color: inherit; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    transition: opacity 0.3s ease;
  }
  #final .top-link:hover { opacity: 0.9; }

  @media (max-width: 640px) {
    #hud { right: 12px; bottom: 12px; font-size: 9px; }
    #esc-hint { left: 12px; bottom: 6px; }
  }
</style>
</head>
<body>
<div id="root" class="day">
  <!-- Genesis -->
  <div id="genesis">
    <div class="genesis-title">FIRST SENTENCE</div>
    <div class="genesis-field">
      <input id="sentence" class="genesis-input" autofocus spellcheck="false" />
      <div class="genesis-hint">press enter</div>
    </div>
  </div>

  <!-- Thought world -->
  <div id="viewport" style="display:none">
    <div id="world">
      <svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none"></div>
  <div id="esc-hint" style="display:none">esc · 終了</div>
  <div id="status" style="display:none"></div>

  <!-- Final log -->
  <div id="final" style="display:none"></div>
</div>

  var REL_LABEL = {

  // ---------- 起点の一文から語を取り出す ----------
  var STOP_WORDS = ["こと","もの","ため","から","ので","です","ます","する","した","して","いる","ある","ない",
    "よう","これ","それ","あれ","どう","なぜ","でも","しかし","そして","また","など","まで",
    "より","だけ","ほど","という","として","について","によって","けど","が","を","に","は","の","と","で","も","へ","や"];
  function extractWords(text) {
    var out = [];
    function add(w) {
      if (!w || STOP_WORDS.indexOf(w) >= 0 || out.indexOf(w) >= 0) return;
      if (w.length === 1) {
        if (!/[\u4E00-\u9FFF\u30A0-\u30FF]/.test(w)) return;      // 1文字は漢字・カタカナのみ
      } else {
        if (w.charAt(w.length - 1) === "っ") return;              // 活用の途中（降っ など）は除く
        if (/^[\u3040-\u309F]+$/.test(w) && w.length < 4) return;  // ひらがなだけの短い語は助詞・語尾
      }
      out.push(w);
    }
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
      var it = new Intl.Segmenter("ja", { granularity: "word" }).segment(text)[Symbol.iterator]();
      for (var r = it.next(); !r.done; r = it.next()) { if (r.value.isWordLike) add(r.value.segment); }
    } else {
      (text.match(/[\u4E00-\u9FFF\u30A0-\u30FFー]{2,}|[A-Za-z0-9]{2,}/g) || []).forEach(add);
    }
    if (!out.length) { var t = text.trim(); if (t) out.push(t); }
    return out;
  }

  function normRel(r) {
    r = String(r || "").toLowerCase();
    if (r === "synonym" || r === "syn") return "synonym";
    if (r === "hypernym" || r === "hyper") return "hypernym";
    if (r === "hyponym" || r === "hypo") return "hyponym";
    if (r === "derivation" || r === "deriv") return "derivation";
    return "association";
  }

  function expandFromDict(word) {
    var e = DICT[word];
    if (!e) return [];
    var out = [];
    for (var i = 0; i < e.length; i++) out.push({ word: e[i][0], relation: normRel(e[i][1]) });
    return out;
  }

  async function expandWord(word, depth) {
    return expandFromDict(word);
  }

  // ---------- layout ----------
  var TAG_H = 18, GAP = 22;
  function estSize(word) {
    var n = 0, i;
    for (i = 0; i < word.length; i++) {
      var c = word.charCodeAt(i);
      n += (c >= 0x2E80) ? 1 : 0.55;   // 全角は1、半角は0.55
    }
    return { w: Math.min(260, Math.max(64, Math.round(n * 17) + 14)), h: 26 };
  }
  function rectOf(n) {
    var s = estSize(n.word);
    return { l: n.x - s.w / 2, r: n.x + s.w / 2, t: n.y - s.h / 2 - TAG_H, b: n.y + s.h / 2 };
  }
  function positionNode(anchor, baseDist, nodes, size, parents) {
    var W = size.w;
    function rectAt(x, y) { return { l: x - W / 2, r: x + W / 2, t: y - size.h / 2 - TAG_H, b: y + size.h / 2 }; }
    function hits(x, y) {
      var a = rectAt(x, y);
      for (var k = 0; k < nodes.length; k++) {
        var b = rectOf(nodes[k]);
        if (!(a.r + GAP <= b.l || b.r + GAP <= a.l || a.b + GAP <= b.t || b.b + GAP <= a.t)) return true;
      }
      return false;
    }
    function crosses(x, y) {
      for (var pi = 0; pi < parents.length; pi++) {
        var p = parents[pi];
        var dx = x - p.x, dy = y - p.y, len = Math.hypot(dx, dy) || 1;
        var steps = Math.ceil(len / 14);
        for (var st = 1; st < steps; st++) {
          var px = p.x + dx * st / steps, py = p.y + dy * st / steps;
          for (var k = 0; k < nodes.length; k++) {
            if (parents.indexOf(nodes[k]) >= 0) continue;
            var r = rectOf(nodes[k]);
            if (px > r.l - 4 && px < r.r + 4 && py > r.t - 4 && py < r.b + 4) return true;
          }
        }
      }
      return false;
    }
    var start = Math.random() * Math.PI * 2;
    for (var ring = 0; ring < 70; ring++) {
      var dist = baseDist + ring * 28;
      var n = 30 + ring * 2;
      for (var i = 0; i < n; i++) {
        var ang = start + (i / n) * Math.PI * 2;
        var x = Math.round(anchor.x + Math.cos(ang) * dist);
        var y = Math.round(anchor.y + Math.sin(ang) * dist);
        if (hits(x, y)) continue;
        if (ring < 7 && crosses(x, y)) continue;
        return { x: x, y: y };
      }
    }
    var far = 0;
    for (var q = 0; q < nodes.length; q++) far = Math.max(far, Math.abs(nodes[q].x), Math.abs(nodes[q].y));
    return { x: far + W + 220, y: anchor.y };
  }

  // ---------- view / pan / zoom ----------
  var viewport = document.getElementById("viewport");
  var world = document.getElementById("world");
  var linesSvg = document.getElementById("lines");
  var view = { scale: 1, tx: 0, ty: 0 };
  var userInteracted = 0;
  var dragging = false, lastDrag = null;
  var pts = new Map(), lastPinch = 0;

  function applyTransform(smooth) {
    world.classList.toggle("smooth", !!smooth);
    world.style.transform = "translate(" + view.tx + "px," + view.ty + "px) scale(" + view.scale + ")";
  }

  function autoFit(nodes) {
    if (!nodes.length) return;
    if (Date.now() - userInteracted < 6000) return;
    var pad = 160;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < nodes.length; i++) {
      var rc = rectOf(nodes[i]);
      minX = Math.min(minX, rc.l); minY = Math.min(minY, rc.t);
      maxX = Math.max(maxX, rc.r); maxY = Math.max(maxY, rc.b);
    }
    var w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
    var scale = Math.min((window.innerWidth - pad * 2) / w, (window.innerHeight - pad * 2) / h, 1);
    scale = Math.max(scale, 0.4);
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    view.scale = scale;
    view.tx = window.innerWidth / 2 - cx * scale;
    view.ty = window.innerHeight / 2 - cy * scale;
    applyTransform(true);
  }

  viewport.addEventListener("wheel", function (e) {
    e.preventDefault();
    userInteracted = Date.now();
    var factor = e.deltaY < 0 ? 1.1 : 0.9;
    var newScale = Math.max(0.25, Math.min(2.5, view.scale * factor));
    var rect = viewport.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var wx = (mx - view.tx) / view.scale, wy = (my - view.ty) / view.scale;
    view.scale = newScale;
    view.tx = mx - wx * newScale;
    view.ty = my - wy * newScale;
    applyTransform(false);
  }, { passive: false });

  function pinch(e) {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var a = Array.from(pts.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (lastPinch) {
      var ns = Math.max(0.25, Math.min(2.5, view.scale * d / lastPinch));
      var rect = viewport.getBoundingClientRect();
      var mx = (a[0].x + a[1].x) / 2 - rect.left, my = (a[0].y + a[1].y) / 2 - rect.top;
      var wx = (mx - view.tx) / view.scale, wy = (my - view.ty) / view.scale;
      view.scale = ns; view.tx = mx - wx * ns; view.ty = my - wy * ns;
      applyTransform(false);
    }
    lastPinch = d; userInteracted = Date.now();
  }
  viewport.addEventListener("pointerdown", function (e) {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragging = true; viewport.classList.add("dragging"); lastDrag = { x: e.clientX, y: e.clientY };
    userInteracted = Date.now();
  });
  viewport.addEventListener("pointermove", function (e) {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size > 1) { pinch(e); return; }
    if (!dragging) return;
    var dx = e.clientX - lastDrag.x, dy = e.clientY - lastDrag.y;
    lastDrag = { x: e.clientX, y: e.clientY };
    view.tx += dx; view.ty += dy;
    applyTransform(false);
  });
  function endDrag(e) { if (e) pts.delete(e.pointerId); lastPinch = 0; dragging = false; viewport.classList.remove("dragging"); }
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointerleave", endDrag);

  // ---------- state ----------
  var nodes = [];
  var queue = [];
  var seen = {};
  var phase = "input";
  var running = false;
  var idCounter = 0;
  var startTs = 0;
  var stats = { elapsed: 0, nodes: 0, depth: 0 };
  var seedText = "";

  var genesisEl = document.getElementById("genesis");
  var sentenceEl = document.getElementById("sentence");
  var hudEl = document.getElementById("hud");
  var escEl = document.getElementById("esc-hint");
  var finalEl = document.getElementById("final");
  var statusEl = document.getElementById("status");

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function setStatus(msg) { statusEl.textContent = msg || ""; statusEl.style.display = msg ? "block" : "none"; }
  function nodeById(id) { for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i]; return null; }

  // ---------- render ----------
  function createNodeEl(node) {
    var el = document.createElement("div");
    el.className = "thought-node" + (node.relation === "seed" ? " seed" : "");
    el.setAttribute("data-relation", node.relation);
    var tag = document.createElement("span");
    tag.className = "node-tag";
    tag.textContent = node.relation === "seed" ? "起点 · SEED" : (REL_LABEL[node.relShort] || "");
    el.appendChild(tag);
    el.appendChild(document.createTextNode(node.word));
    el.style.left = node.x + "px";
    el.style.top = node.y + "px";
    world.appendChild(el);
    node.el = el;
  }

  function renderLines() {
    while (linesSvg.firstChild) linesSvg.removeChild(linesSvg.firstChild);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.parentId == null) continue;
      var p = nodeById(n.parentId);
      if (!p) continue;
      var mx = (p.x + n.x) / 2 + (n.y - p.y) * 0.22;
      var my = (p.y + n.y) / 2 - (n.x - p.x) * 0.22;
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "thought-line r-" + n.relShort);
      path.setAttribute("d", "M " + p.x + " " + p.y + " Q " + mx + " " + my + " " + n.x + " " + n.y);
      linesSvg.appendChild(path);
    }
  }

  function addNode(word, relation, relShort, parentId, depth) {
    var id = ++idCounter;
    var parent = parentId != null ? nodeById(parentId) : null;
    var node = { id: id, word: word, relation: REL_FULL[relShort] || "association", relShort: relShort,
                 parentId: parentId, depth: depth, x: 0, y: 0 };
    if (parent) {
      var pos = positionNode(parent, 190 + depth * 14, nodes, estSize(word), [parent]);
      node.x = pos.x; node.y = pos.y;
    }
    nodes.push(node);
    createNodeEl(node);
    return node;
  }

  function fmtTime(s) {
    var h = String(Math.floor(s / 3600)).padStart(2, "0");
    var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    var ss = String(s % 60).padStart(2, "0");
    return h + ":" + m + ":" + ss;
  }
  function renderHud() {
    hudEl.innerHTML =
      "ELAPSED " + fmtTime(stats.elapsed) + "<br>" +
      "NODES " + stats.nodes + "<br>" +
      "DEPTH " + stats.depth + "<br>" +
      "QUEUE " + queue.length;
  }
  function relToShort(rel) {
    if (rel === "synonym") return "syn";
    if (rel === "hypernym") return "hyper";
    if (rel === "hyponym") return "hypo";
    if (rel === "derivation") return "deriv";
    return "assoc";
  }

  // ---------- loop : 幅優先で語を広げる ----------
  var MAX_NODES = 140, MAX_DEPTH = 6;
  async function loop() {
    while (running) {
      if (nodes.length >= MAX_NODES) { setStatus("宇宙が広がりきった · esc で終了"); break; }
      var nextId = queue.shift();
      if (nextId == null) { setStatus("広がりが止まった · esc で終了"); break; }
      var node = nodeById(nextId);
      if (!node || node.depth >= MAX_DEPTH) continue;

      setStatus("「" + node.word + "」から広げている…");
      var related;
      try { related = await expandWord(node.word, node.depth); }
      catch (e) { await sleep(2000); continue; }
      if (!running) break;

      var added = 0;
      for (var i = 0; i < related.length && nodes.length < MAX_NODES; i++) {
        var w = related[i].word;
        if (!w || seen[w]) continue;
        seen[w] = 1;
        addNode(w, related[i].relation, relToShort(related[i].relation), node.id, node.depth + 1);
        queue.push(idCounter);
        added++;
      }
      renderLines();
      stats.nodes = nodes.length;
      for (var d = 0; d < nodes.length; d++) stats.depth = Math.max(stats.depth, nodes[d].depth);
      stats.elapsed = Math.floor((Date.now() - startTs) / 1000);
      renderHud();
      autoFit(nodes);
      setStatus("");
      await sleep(added ? 650 : 200);
    }
  }

  // ---------- start ----------
  function start() {
    if (phase !== "input") return;
    var text = sentenceEl.value.trim();
    if (!text) return;
    seedText = text;

    var seeds = extractWords(text);
    var viable = seeds.filter(function (w) { return DICT[w]; });
    if (viable.length) seeds = viable;

    genesisEl.style.opacity = "0";
    setTimeout(function () { genesisEl.style.display = "none"; }, 1200);
    viewport.style.display = "block";
    hudEl.style.display = "block";
    escEl.style.display = "block";

    nodes = []; queue = []; seen = {}; idCounter = 0;
    stats = { elapsed: 0, nodes: 0, depth: 0 };

    var totalW = (seeds.length - 1) * 240;
    for (var i = 0; i < seeds.length; i++) {
      var n = { id: ++idCounter, word: seeds[i], relation: "seed", relShort: "seed",
                parentId: null, depth: 0, x: Math.round(i * 240 - totalW / 2), y: 0 };
      nodes.push(n); seen[seeds[i]] = 1; queue.push(n.id);
      createNodeEl(n);
    }
    stats.nodes = nodes.length;
    renderHud();
    autoFit(nodes);

    try { if (navigator.wakeLock) navigator.wakeLock.request("screen"); } catch (e) {}

    phase = "running";
    running = true;
    startTs = Date.now();
    setInterval(function () {
      if (phase !== "running") return;
      stats.elapsed = Math.floor((Date.now() - startTs) / 1000);
      renderHud();
    }, 1000);
    loop();
  }
  sentenceEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); start(); }
  });

  // ---------- end ----------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function endSession() {
    if (phase !== "running") return;
    running = false;
    phase = "ended";
    viewport.style.display = "none";
    hudEl.style.display = "none";
    escEl.style.display = "none";
    setStatus("");

    finalEl.style.display = "flex";
    finalEl.innerHTML =
      '<div class="meta">' +
        "<div>SESSION 001</div>" +
        "<div>HUMAN INPUT 「" + escapeHtml(seedText) + "」</div>" +
        '<div style="height:1.1em"></div>' +
        "<div>ELAPSED " + fmtTime(stats.elapsed) + "</div>" +
        "<div>NODES " + stats.nodes + "</div>" +
        "<div>DEPTH " + stats.depth + "</div>" +
      "</div>" +
      '<div class="gap"></div>' +
      '<div class="last">あなたが与えた一文から、' + stats.nodes + " 個の語がつながった。</div>" +
      '<div class="gap"></div>' +
      '<div class="closing">最初の一文が、宇宙の形を決めた。</div>' +
      '<a class="top-link" id="top-link">TOPへ</a>';
    var topLink = document.getElementById("top-link");
    if (topLink) topLink.addEventListener("click", function () { location.reload(); });
  }

  escEl.addEventListener("click", endSession);
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && phase === "running") endSession();
  });
})();
</script>
</body>
</html>
