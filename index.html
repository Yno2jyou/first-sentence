<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>FIRST SENTENCE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #root {
    position: fixed; inset: 0;
    transition: background-color 2s ease, color 2s ease;
  }
  #root.day  { background-color: #ffffff; color: #111111; }
  #root.night{ background-color: #050505; color: #eeeeee; }

  /* Canvas */
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #canvas.dragging { cursor: grabbing; }

  /* Genesis UI */
  #genesis {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 64px; transition: opacity 0.8s ease; z-index: 10; pointer-events: auto;
  }
  .genesis-title { font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; font-weight: 400; }
  .genesis-field { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .genesis-input {
    width: min(560px, 80vw); background: transparent; border: none; border-bottom: 1px solid;
    outline: none; padding: 8px 4px; font-size: 18px; letter-spacing: 0.02em;
    color: inherit; text-align: center; border-radius: 0;
  }
  #root.day .genesis-input   { border-bottom-color: rgba(0,0,0,0.2); }
  #root.night .genesis-input { border-bottom-color: rgba(255,255,255,0.3); }
  .genesis-hint { font-size: 10px; letter-spacing: 0.22em; opacity: 0.3; text-transform: uppercase; }

  /* Overlay UI */
  #hud {
    position: fixed; right: 22px; bottom: 20px;
    font-size: 10px; line-height: 1.9; letter-spacing: 0.1em; opacity: 0.7;
    text-align: right; pointer-events: none; user-select: none; z-index: 20;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #esc-hint {
    position: fixed; left: 22px; bottom: 20px;
    font-size: 10px; letter-spacing: 0.22em; opacity: 0.3; text-transform: uppercase;
    pointer-events: auto; cursor: pointer; padding: 8px; z-index: 20;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #status {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.14em; opacity: 0.6; text-align: center;
    pointer-events: none; z-index: 20;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  /* Final Log */
  #final {
    position: fixed; inset: 0; overflow-y: auto; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: inherit;
  }
  #final .meta {
    font-size: 11px; line-height: 2.2; letter-spacing: 0.14em; opacity: 0.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #final .top-link {
    margin-top: 3em; font-size: 11px; letter-spacing: 0.22em; opacity: 0.5;
    text-transform: uppercase; text-decoration: none; color: inherit; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    transition: opacity 0.3s;
  }
  #final .top-link:hover { opacity: 1; }
</style>
</head>
<body>
<div id="root" class="day">
  <div id="genesis">
    <div class="genesis-title">FIRST SENTENCE</div>
    <div class="genesis-field">
      <input id="sentence" class="genesis-input" autofocus spellcheck="false" placeholder="" />
      <div class="genesis-hint">press enter</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="hud" style="display:none"></div>
  <div id="esc-hint" style="display:none">esc · 終了</div>
  <div id="status" style="display:none"></div>
  <div id="final" style="display:none"></div>
</div>

<script>
(function () {
  "use strict";

  // テーマ設定
  var THEME = {
    day: {
      bg: "#ffffff", line: "rgba(180,180,180,0.35)", text: "#111111",
      syn: "#15803d", hyper: "#1d4ed8", hypo: "#d62828", assoc: "#b45309", deriv: "#7c3aed"
    },
    night: {
      bg: "#050505", line: "rgba(70,70,70,0.45)", text: "#ffffff",
      syn: "#4fd18b", hyper: "#6aa5ff", hypo: "#ff6b6b", assoc: "#fbbf24", deriv: "#c4b5fd"
    }
  };

  function getPhase() {
    var h = new Date().getHours();
    return (h >= 6 && h < 18) ? "day" : "night";
  }
  
  var currentPhase = getPhase();
  var root = document.getElementById("root");
  root.className = currentPhase;

  // 大広域・多言語・自然単語データベース
  var NATURAL_WORDS = [
    // 自然・宇宙・物質
    "雨", "水", "空", "海", "風", "光", "雲", "星", "月", "太陽", "銀河", "深海", "地平", "真空", "新緑",
    "結晶", "樹木", "原野", "孤島", "流星", "地殻", "大気", "オーロラ", "極光", "脈動", "暗黒物質", "星雲",
    // 精神・概念・言葉
    "記憶", "未来", "過去", "情熱", "静寂", "思考", "対話", "哲学", "言葉", "音楽", "色彩", "建築",
    "時間", "空間", "存在", "生命", "意識", "希望", "調和", "真理", "世界", "波動", "共鳴", "物語",
    "幻想", "現実", "観測", "粒子", "万物", "感情", "精神", "知恵", "創世", "呼吸", "輪郭", "余白", "残響",
    // 科学・数理・文明
    "幾何学", "定理", "極限", "次元", "構造", "秩序", "混沌", "電磁波", "熱力学", "エントロピー", "位相",
    "記号", "概念", "文脈", "起源", "終義", "螺旋", "影", "鏡像", "微光", "軌道", "果実", "熱量",
    // 多言語・国際単語 (Multilingual Concepts)
    "Cosmos", "Aether", "Genesis", "Nexus", "Chaos", "Horizon", "Echo", "Spectrum", "Paradox", "Lumina",
    "Nova", "Aura", "Veritas", "Symphony", "Astral", "Prism", "Chronos", "Logos", "Entropy", "Starlight",
    "Aeterna", "Vortex", "Sola", "Luna", "Aethel", "Ignis", "Aqua", "Ventus", "Terra", "Zephyr"
  ];

  var DICT = {
    "雨": [["水滴","assoc"],["雨雲","assoc"],["雨傘","assoc"],["梅雨","hyper"],["豪雨","hypo"],["虹","assoc"],["Aqua","assoc"]],
    "水": [["海洋","assoc"],["河川","hypo"],["氷結","deriv"],["液体","hyper"],["水蒸気","assoc"],["Aqua","syn"]],
    "宇宙": [["星々","assoc"],["時間","assoc"],["空間","assoc"],["銀河","assoc"],["無限","assoc"],["重力","assoc"],["Cosmos","syn"]],
    "心": [["感情","assoc"],["人間","assoc"],["記憶","assoc"],["思考","assoc"],["精神","syn"],["Logos","assoc"]],
    "言葉": [["音声","assoc"],["文字","assoc"],["対話","assoc"],["意味","assoc"],["文学","hypo"],["Logos","syn"]]
  };

  var REL_TAG = { "syn": "類義", "hyper": "上位", "hypo": "下位", "assoc": "連想", "deriv": "派生", "seed": "起点" };

  function expandWord(word) {
    var out = [];
    if (DICT[word]) {
      var e = DICT[word];
      for (var i = 0; i < e.length; i++) out.push({ word: e[i][0], rel: e[i][1] });
    }
    
    // 自然な多言語単語リストからシャッフル抽出（各ノードから最大7つの接続を分岐）
    var poolCopy = NATURAL_WORDS.slice();
    for (var k = poolCopy.length - 1; k > 0; k--) {
      var r = Math.floor(Math.random() * (k + 1));
      var temp = poolCopy[k]; poolCopy[k] = poolCopy[r]; poolCopy[r] = temp;
    }
    
    var relTypes = ["assoc", "hyper", "hypo", "syn", "deriv"];
    for (var j = 0; j < poolCopy.length && out.length < 7; j++) {
      if (poolCopy[j] !== word) {
        var rel = relTypes[Math.floor(Math.random() * relTypes.length)];
        out.push({ word: poolCopy[j], rel: rel });
      }
    }
    return out;
  }

  function extractWords(text) {
    var found = [], keys = Object.keys(DICT);
    for (var i = 0; i < keys.length; i++) {
      if (text.indexOf(keys[i]) !== -1) found.push(keys[i]);
    }
    if (!found.length) {
      var parts = text.split(/[\s、。！？!?,.]+/).filter(Boolean);
      for (var j = 0; j < parts.length; j++) {
        if (parts[j].length >= 1 && parts[j].length <= 12) found.push(parts[j]);
      }
    }
    if (!found.length) found.push(text.slice(0, 6));
    return found;
  }

  // ---------- AABB衝突判定 & ダイナミック広域配置 ----------
  var MARGIN_X = 55; // ノード横間隔
  var MARGIN_Y = 40; // ノード縦間隔

  function getBoundingBoxWidth(word, isSeed) {
    var fontSize = isSeed ? 18 : 14;
    var len = 0;
    for (var i = 0; i < word.length; i++) {
      len += word.charCodeAt(i) >= 0x2E80 ? 1.0 : 0.65;
    }
    return Math.ceil(len * fontSize + 24);
  }

  function positionNode(anchor, baseDist, existingNodes, width, height) {
    var startAng = Math.random() * Math.PI * 2;
    var nodeCount = existingNodes.length;

    // 螺旋状探索（広大なキャンバスへ高密度・非重複で展開）
    for (var ring = 0; ring < 300; ring++) {
      var dist = baseDist + ring * 16;
      var steps = 14 + Math.floor(ring * 2.5);
      for (var i = 0; i < steps; i++) {
        var ang = startAng + (i / steps) * Math.PI * 2;
        var cx = Math.round(anchor.x + Math.cos(ang) * dist);
        var cy = Math.round(anchor.y + Math.sin(ang) * dist);

        var nl = cx - width / 2;
        var nr = cx + width / 2;
        var nt = cy - height / 2;
        var nb = cy + height / 2;

        var collide = false;
        for (var k = 0; k < nodeCount; k++) {
          var o = existingNodes[k];
          if (!(nr + MARGIN_X <= o.l - MARGIN_X || 
                nl - MARGIN_X >= o.r + MARGIN_X || 
                nb + MARGIN_Y <= o.t - MARGIN_Y || 
                nt - MARGIN_Y >= o.b + MARGIN_Y)) {
            collide = true;
            break;
          }
        }

        if (!collide) {
          return { x: cx, y: cy, l: nl, r: nr, t: nt, b: nb };
        }
      }
    }
    
    var farX = anchor.x + (Math.random() - 0.5) * 5000;
    var farY = anchor.y + (Math.random() - 0.5) * 5000;
    return { x: farX, y: farY, l: farX - width/2, r: farX + width/2, t: farY - height/2, b: farY + height/2 };
  }

  // ---------- Canvas & タッチ操作 ----------
  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d", { alpha: false });
  var dpr = window.devicePixelRatio || 1;

  var view = { x: 0, y: 0, scale: 0.8 };
  var dragging = false, lastMouse = { x: 0, y: 0 };
  var activePointers = {};
  var initialPinchDist = 0;
  var initialScale = 0.8;
  var userInteracted = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  view.x = window.innerWidth / 2;
  view.y = window.innerHeight / 2;

  // マウスホイール
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    userInteracted = true;
    var factor = e.deltaY < 0 ? 1.05 : 0.95;
    var newScale = Math.max(0.015, Math.min(3.0, view.scale * factor));
    
    var mx = e.clientX, my = e.clientY;
    var wx = (mx - view.x) / view.scale;
    var wy = (my - view.y) / view.scale;

    view.scale = newScale;
    view.x = mx - wx * newScale;
    view.y = my - wy * newScale;
  }, { passive: false });

  // ポインター・タッチ操作
  canvas.addEventListener("pointerdown", function (e) {
    activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    userInteracted = true;

    var ptrs = Object.keys(activePointers);
    if (ptrs.length === 1) {
      dragging = true;
      canvas.classList.add("dragging");
      lastMouse = { x: e.clientX, y: e.clientY };
    } else if (ptrs.length === 2) {
      dragging = false;
      var p1 = activePointers[ptrs[0]];
      var p2 = activePointers[ptrs[1]];
      initialPinchDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      initialScale = view.scale;
    }
  });

  window.addEventListener("pointermove", function (e) {
    if (!activePointers[e.pointerId]) return;
    activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };

    var ptrs = Object.keys(activePointers);
    if (ptrs.length === 1 && dragging) {
      var dx = e.clientX - lastMouse.x;
      var dy = e.clientY - lastMouse.y;
      view.x += dx;
      view.y += dy;
      lastMouse = { x: e.clientX, y: e.clientY };
    } else if (ptrs.length === 2) {
      var p1 = activePointers[ptrs[0]];
      var p2 = activePointers[ptrs[1]];
      var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (initialPinchDist > 5) {
        var center = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        var factor = dist / initialPinchDist;
        var newScale = Math.max(0.015, Math.min(3.0, initialScale * factor));

        var wx = (center.x - view.x) / view.scale;
        var wy = (center.y - view.y) / view.scale;

        view.scale = newScale;
        view.x = center.x - wx * newScale;
        view.y = center.y - wy * newScale;
      }
    }
  });

  function handlePointerEnd(e) {
    delete activePointers[e.pointerId];
    var ptrs = Object.keys(activePointers);
    if (ptrs.length < 2) { initialPinchDist = 0; }
    if (ptrs.length === 1) {
      dragging = true;
      lastMouse = { x: activePointers[ptrs[0]].x, y: activePointers[ptrs[0]].y };
    } else if (ptrs.length === 0) {
      dragging = false;
      canvas.classList.remove("dragging");
    }
  }

  window.addEventListener("pointerup", handlePointerEnd);
  window.addEventListener("pointercancel", handlePointerEnd);

  // ---------- State ----------
  var nodes = [];
  var queue = [];
  var seen = {};
  var phase = "input";
  var running = false;
  var idCounter = 0;
  var startTs = 0;
  var seedText = "";
  var stats = { elapsed: 0, nodes: 0, depth: 0 };

  var genesisEl = document.getElementById("genesis");
  var sentenceEl = document.getElementById("sentence");
  var hudEl = document.getElementById("hud");
  var escEl = document.getElementById("esc-hint");
  var statusEl = document.getElementById("status");
  var finalEl = document.getElementById("final");

  function setStatus(msg) { statusEl.textContent = msg || ""; statusEl.style.display = msg ? "block" : "none"; }

  function addNode(word, rel, parentId, depth) {
    var id = ++idCounter;
    var isSeed = (rel === "seed");
    var w = getBoundingBoxWidth(word, isSeed);
    var h = isSeed ? 32 : 24;

    var parent = parentId ? nodes[parentId - 1] : null;
    var pos;
    if (parent) {
      pos = positionNode(parent, 160 + Math.min(depth, 15) * 10, nodes, w, h);
    } else {
      pos = { x: 0, y: 0, l: -w/2, r: w/2, t: -h/2, b: h/2 };
    }

    var node = {
      id: id, word: word, rel: rel, parentId: parentId, depth: depth,
      x: pos.x, y: pos.y, l: pos.l, r: pos.r, t: pos.t, b: pos.b,
      w: w, h: h, alpha: 0
    };
    nodes.push(node);
    return node;
  }

  function autoFit() {
    if (!nodes.length || userInteracted) return;
    
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var step = nodes.length > 1000 ? 8 : 1;
    for (var i = 0; i < nodes.length; i += step) {
      minX = Math.min(minX, nodes[i].l); minY = Math.min(minY, nodes[i].t);
      maxX = Math.max(maxX, nodes[i].r); maxY = Math.max(maxY, nodes[i].b);
    }
    var bw = Math.max(maxX - minX, 200), bh = Math.max(maxY - minY, 200);
    var pad = 180;
    var s = Math.min((window.innerWidth - pad) / bw, (window.innerHeight - pad) / bh);
    s = Math.max(0.015, Math.min(s, 0.9));

    view.scale = s;
    view.x = window.innerWidth / 2 - ((minX + maxX) / 2) * s;
    view.y = window.innerHeight / 2 - ((minY + maxY) / 2) * s;
  }

  // ---------- 描画 ----------
  function render() {
    var theme = THEME[currentPhase];
    ctx.save();
    ctx.scale(dpr, dpr);

    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    if (phase === "running" || phase === "ended") {
      ctx.save();
      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);

      var screenL = -view.x / view.scale - 120;
      var screenR = (window.innerWidth - view.x) / view.scale + 120;
      var screenT = -view.y / view.scale - 120;
      var screenB = (window.innerHeight - view.y) / view.scale + 120;

      // 1. 接続線
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeStyle = theme.line;
      ctx.beginPath();
      for (var i = 1; i < nodes.length; i++) {
        var n = nodes[i];
        var p = nodes[n.parentId - 1];
        if (!p) continue;
        if ((n.x < screenL && p.x < screenL) || (n.x > screenR && p.x > screenR) ||
            (n.y < screenT && p.y < screenT) || (n.y > screenB && p.y > screenB)) continue;

        var mx = (p.x + n.x) / 2 + (n.y - p.y) * 0.1;
        var my = (p.y + n.y) / 2 - (n.x - p.x) * 0.1;
        ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo(mx, my, n.x, n.y);
      }
      ctx.stroke();

      // 2. ノード描画
      for (var j = 0; j < nodes.length; j++) {
        var node = nodes[j];
        if (node.x < screenL || node.x > screenR || node.y < screenT || node.y > screenB) continue;

        if (node.alpha < 1) node.alpha = Math.min(1, node.alpha + 0.18);

        ctx.save();
        ctx.translate(node.x, node.y);
        ctx.globalAlpha = node.alpha;

        var color = theme[node.rel] || theme.text;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (node.rel === "seed") {
          ctx.font = "bold 18px sans-serif";
          ctx.fillStyle = theme.text;
          ctx.fillText(node.word, 0, 0);
          ctx.lineWidth = 2;
          ctx.strokeStyle = theme.text;
          ctx.beginPath();
          ctx.moveTo(-node.w / 2 + 4, 14);
          ctx.lineTo(node.w / 2 - 4, 14);
          ctx.stroke();
        } else {
          ctx.font = "9px monospace";
          ctx.fillStyle = color;
          ctx.globalAlpha = node.alpha * 0.6;
          ctx.fillText(REL_TAG[node.rel] || "", 0, -13);

          ctx.globalAlpha = node.alpha;
          ctx.font = (node.rel === "hyper" ? "bold " : "") + "14px sans-serif";
          ctx.fillStyle = color;
          ctx.fillText(node.word, 0, 0);
        }
        ctx.restore();
      }

      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // ---------- 無限拡大言語宇宙の生成ループ ----------
  var MAX_NODES = 6000; // 巨大言語宇宙（6,000ノード）

  async function loop() {
    while (running) {
      if (nodes.length >= MAX_NODES) { setStatus("無限言語宇宙完成 · esc で終了"); break; }
      var nextId = queue.shift();
      if (nextId == null) { setStatus("宇宙展開完了 · esc で終了"); break; }
      var node = nodes[nextId - 1];
      if (!node) continue;

      var related = expandWord(node.word);
      var added = 0;
      for (var i = 0; i < related.length && nodes.length < MAX_NODES; i++) {
        var item = related[i];
        if (!item.word || seen[item.word]) continue;
        seen[item.word] = 1;
        var newNode = addNode(item.word, item.rel, node.id, node.depth + 1);
        queue.push(newNode.id);
        added++;
      }

      stats.nodes = nodes.length;
      stats.depth = Math.max(stats.depth, node.depth + 1);
      stats.elapsed = Math.floor((Date.now() - startTs) / 1000);
      
      hudEl.innerHTML =
        "ELAPSED " + fmtTime(stats.elapsed) + "<br>" +
        "NODES " + stats.nodes + "<br>" +
        "DEPTH " + stats.depth + "<br>" +
        "QUEUE " + queue.length;

      if (nodes.length % 12 === 0) autoFit();
      await new Promise(function (r) { setTimeout(r, added ? 6 : 2); });
    }
  }

  function fmtTime(s) {
    var h = String(Math.floor(s / 3600)).padStart(2, "0");
    var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    var ss = String(s % 60).padStart(2, "0");
    return h + ":" + m + ":" + ss;
  }

  function start() {
    if (phase !== "input") return;
    var text = sentenceEl.value.trim();
    if (!text) return;
    seedText = text;

    genesisEl.style.opacity = "0";
    setTimeout(function () { genesisEl.style.display = "none"; }, 800);
    hudEl.style.display = "block";
    escEl.style.display = "block";

    nodes = []; queue = []; seen = {}; idCounter = 0;
    stats = { elapsed: 0, nodes: 0, depth: 0 };
    userInteracted = false;

    var seedNode = addNode(text, "seed", null, 0);
    seen[text] = 1;

    var extracted = extractWords(text);
    for (var i = 0; i < extracted.length; i++) {
      var w = extracted[i];
      if (!seen[w]) {
        seen[w] = 1;
        var sub = addNode(w, "assoc", seedNode.id, 1);
        queue.push(sub.id);
      }
    }

    stats.nodes = nodes.length;
    autoFit();

    phase = "running";
    running = true;
    startTs = Date.now();
    loop();
  }

  sentenceEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); start(); }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function endSession() {
    if (phase !== "running") return;
    running = false;
    phase = "ended";
    hudEl.style.display = "none";
    escEl.style.display = "none";
    setStatus("");

    finalEl.style.display = "flex";
    finalEl.innerHTML =
      '<div class="meta">' +
        "<div>SESSION 001</div>" +
        "<div>INPUT 「" + escapeHtml(seedText) + "」</div>" +
        '<div style="height:1.2em"></div>' +
        "<div>ELAPSED " + fmtTime(stats.elapsed) + "</div>" +
        "<div>NODES " + stats.nodes + "</div>" +
        "<div>DEPTH " + stats.depth + "</div>" +
      "</div>" +
      '<a class="top-link" id="top-link">TOP</a>';
    
    var topLink = document.getElementById("top-link");
    if (topLink) topLink.addEventListener("click", function () { location.reload(); });
  }

  escEl.addEventListener("click", endSession);
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && phase === "running") endSession();
  });
})();
</script>
</body>
</html>
