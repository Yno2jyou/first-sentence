<title>FIRST SENTENCE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #root {
    position: fixed; inset: 0;
    transition: background-color 2s ease, color 2s ease;
  }
  #root.day  { background-color: #ffffff; color: #111111; }
  #root.night{ background-color: #050505; color: #eeeeee; }

  /* Canvas */
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #canvas.dragging { cursor: grabbing; }

  /* Genesis UI */
  #genesis {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 64px; transition: opacity 0.8s ease; z-index: 10; pointer-events: auto;
  }
  .genesis-title { font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; font-weight: 400; }
  .genesis-field { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .genesis-input {
    width: min(560px, 80vw); background: transparent; border: none; border-bottom: 1px solid;
    outline: none; padding: 8px 4px; font-size: 18px; letter-spacing: 0.02em;
    color: inherit; text-align: center; border-radius: 0;
  }
  #root.day .genesis-input   { border-bottom-color: rgba(0,0,0,0.2); }
  #root.night .genesis-input { border-bottom-color: rgba(255,255,255,0.3); }
  .genesis-hint { font-size: 10px; letter-spacing: 0.22em; opacity: 0.3; text-transform: uppercase; }

  /* Overlay UI */
  #hud {
    position: fixed; right: 22px; bottom: 20px;
    font-size: 10px; line-height: 1.9; letter-spacing: 0.1em; opacity: 0.7;
    text-align: right; pointer-events: none; user-select: none; z-index: 20;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #root.day #genesis.veil { background: rgba(255,255,255,0.55); }
  #root.night #genesis.veil { background: rgba(5,5,5,0.55); }
  #genesis { transition: opacity 0.8s ease, background-color 0.5s ease; }
  .btn2 { cursor: pointer; opacity: 0.45; padding: 4px; }
  .btn2:hover { opacity: 0.9; }
  #bar { position: fixed; left: 22px; bottom: 20px; display: flex; gap: 6px; z-index: 20; }
  .btn { font-size: 10px; letter-spacing: 0.22em; opacity: 0.35; cursor: pointer; padding: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .btn:hover { opacity: 0.9; }
  #esc-hint {
    position: fixed; left: 22px; bottom: 20px;
    font-size: 10px; letter-spacing: 0.22em; opacity: 0.3; text-transform: uppercase;
    pointer-events: auto; cursor: pointer; padding: 8px; z-index: 20;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #status {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.14em; opacity: 0.6; text-align: center;
    pointer-events: none; z-index: 20;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  /* Final Log */
  #final {
    position: fixed; inset: 0; overflow-y: auto; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: inherit;
  }
  #final .meta {
    font-size: 11px; line-height: 2.2; letter-spacing: 0.14em; opacity: 0.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  #final .top-link {
    margin-top: 3em; font-size: 11px; letter-spacing: 0.22em; opacity: 0.5;
    text-transform: uppercase; text-decoration: none; color: inherit; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    transition: opacity 0.3s;
  }
  #final .top-link:hover { opacity: 1; }
</style>

<div id="root" class="day">

  // ---------- 入力UI ----------
  function hideGenesis() { gOpen = false; genesisEl.style.opacity = "0"; setTimeout(function () { if (!gOpen) { genesisEl.style.display = "none"; genesisEl.classList.remove("veil"); } }, 800); }
  function showGenesis() { gOpen = true; if (phase === "running") genesisEl.classList.add("veil"); genesisEl.style.display = "flex"; setTimeout(function () { if (gOpen) { genesisEl.style.opacity = "1"; sentenceEl.focus(); } }, 10); }
  function resetUniverse() { nodes = []; galaxies = []; seen = {}; idCounter = 0; grid = new Map(); stats = { elapsed: 0, nodes: 0, depth: 0 }; }
  function begin() {
    phase = "running"; running = true; hideGenesis();
    hudEl.style.display = "block"; barEl.style.display = "flex"; finalEl.style.display = "none";
    startTs = Date.now() - stats.elapsed * 1000; needsRedraw = true; tick();
  }
  function submit() {
    var text = sentenceEl.value.trim();
    if (!text) return;
    sentenceEl.value = "";
    if (phase === "input") { resetUniverse(); newGalaxy(text); autoFit(); begin(); }
    else if (phase === "running") { newGalaxy(text); hideGenesis(); }
  }
  sentenceEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); }
  });

  // ---------- 保存・読込（IndexedDB ＋ ファイル） ----------
  function serialize() {
    var arr = new Array(nodes.length);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      arr[i] = [n.word, RELS.indexOf(n.rel), n.parentId, n.depth, Math.round(n.x), Math.round(n.y), n.g, Math.round(n.u * 1000) / 1000, Math.round(n.v)];
    }
    return JSON.stringify({
      v: 1, elapsed: stats.elapsed, depth: stats.depth,
      galaxies: galaxies.map(function (g) { return { seed: g.seed, cx: g.cx, cy: g.cy, target: g.target, est: g.est, bound: g.bound, sh: g.sh, R: g.R, done: g.done, queue: g.queue.slice(g.qh) }; }),
      nodes: arr
    });
  }
  function restore(json) {
    var d = JSON.parse(json);
    resetUniverse();
    d.galaxies.forEach(function (gd, i) {
      galaxies.push({ id: i, seed: gd.seed, cx: gd.cx, cy: gd.cy, target: gd.target, est: gd.est, bound: gd.bound || gd.est * 1.3, sh: gd.sh || DEFAULT_SH, V: 0, R: gd.R, done: gd.done, list: [], queue: gd.queue, qh: 0 });
    });
    d.nodes.forEach(function (a) {
      var g = galaxies[a[6]], rel = RELS[a[1]], u = a[7] !== undefined ? a[7] : Math.atan2(a[5] - g.cy, a[4] - g.cx), v = a[8] !== undefined ? a[8] : Math.hypot(a[4] - g.cx, a[5] - g.cy), n = makeNode(a[0], rel, a[2], a[3], a[4], a[5], g, u, v);
      n.alpha = 1; seen[a[0]] = 1;
    });
    galaxies.forEach(function (g, i) { g.R = d.galaxies[i].R; });
    stats.elapsed = d.elapsed || 0; stats.depth = d.depth || 0; userInteracted = false;
    autoFit(); begin();
  }
  function idb(mode, fn) {
    return new Promise(function (res, rej) {
      var rq = indexedDB.open("firstsentence", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("u"); };
      rq.onerror = function () { rej(rq.error); };
      rq.onsuccess = function () {
        var tx = rq.result.transaction("u", mode), r = fn(tx.objectStore("u"));
        tx.oncomplete = function () { res(r && r.result); }; tx.onerror = function () { rej(tx.error); };
      };
    });
  }
  function saveUniverse() {
    if (!nodes.length) return;
    flash("保存中…");
    idb("readwrite", function (st) { return st.put(serialize(), "universe"); })
      .then(function () { flash("言語宇宙を保存しました（" + galaxies.length + " 銀河 / " + nodes.length + " ノード）"); })
      .catch(function () { flash("保存に失敗しました。「書出」でファイル保存してください"); });
  }
  function exportUniverse() {
    if (!nodes.length) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([serialize()], { type: "application/json" }));
    a.download = "language-universe.json"; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  document.getElementById("load-idb").addEventListener("click", function () {
    idb("readonly", function (st) { return st.get("universe"); })
      .then(function (s) { if (s) restore(s); else document.getElementById("load-idb").textContent = "No saved galaxy found"; })
      .catch(function () { document.getElementById("load-idb").textContent = "Could not open the galaxy"; });
  });
  document.getElementById("load-file").addEventListener("click", function () { fileEl.click(); });
  fileEl.addEventListener("change", function () {
    var f = fileEl.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { restore(r.result); }; r.readAsText(f);
  });
  document.getElementById("b-new").addEventListener("click", showGenesis);
  document.getElementById("b-save").addEventListener("click", saveUniverse);
  document.getElementById("b-exp").addEventListener("click", exportUniverse);
  document.getElementById("b-end").addEventListener("click", endSession);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function endSession() {
    if (phase !== "running") return;
    running = false; phase = "ended"; gOpen = false; genesisEl.style.display = "none";
    hudEl.style.display = "none"; barEl.style.display = "none"; setStatus("");
    finalEl.style.display = "flex";
    var ln = 'class="top-link" style="margin-top:1.6em;display:block"';
    finalEl.innerHTML = '<div class="meta"><div>LANGUAGE UNIVERSE</div><div style="height:1.2em"></div>' +
      "<div>GALAXIES " + galaxies.length + "</div><div>NODES " + stats.nodes + "</div><div>DEPTH " + stats.depth + "</div>" +
      "<div>ELAPSED " + fmtTime(stats.elapsed) + "</div></div>" +
      "<a " + ln + ' id="f-cont">CONTINUE</a><a ' + ln + ' id="f-save">SAVE</a><a ' + ln + ' id="f-exp">EXPORT</a><a ' + ln + ' id="f-top">TOP</a>';
    document.getElementById("f-cont").onclick = begin;
    document.getElementById("f-save").onclick = saveUniverse;
    document.getElementById("f-exp").onclick = exportUniverse;
    document.getElementById("f-top").onclick = function () { location.reload(); };
  }
  window.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (phase === "running" && gOpen) hideGenesis();
    else if (phase === "running") endSession();
  });
})();
</script>
</body>
</html>
